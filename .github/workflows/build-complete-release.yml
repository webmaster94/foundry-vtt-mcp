name: Build Complete Release

# Tag pushes build the complete desktop/installer release. Manual dispatch is
# retained for dry runs and artifact-only validation from a branch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (must match all manifests; leave empty to auto-detect)'
        required: false
        default: ''
      dry_run_foundry:
        description: 'Test Foundry API call without actually updating registry'
        required: false
        default: 'false'
        type: boolean

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Check manifest versions
        run: npm run version:check

      - name: Build all workspaces
        run: npm run build

      - name: Strict typecheck
        run: npm run typecheck

      - name: Desktop lint
        run: npm run lint:desktop

      - name: Unit tests
        run: npm test

      - name: Desktop Electron lifecycle tests
        run: xvfb-run --auto-servernum npm run test:desktop:e2e

      - name: MCP schema and catalog checks
        run: npm run test:mcp:schema

      - name: Fork feature preservation contract
        run: npm run test:fork-contract

      - name: Removed-feature regression check
        run: npm run test:removed-features

      - name: Installer path safety regression check
        run: npm run test:installer-safety

      - name: Check patch whitespace
        run: git diff --check

  build-nsis:
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Set Package Version
        id: version
        run: |
          try {
            if ("${{ github.event.inputs.version }}" -ne "") {
              $version = "${{ github.event.inputs.version }}"
              Write-Host "✓ Using manual input version: $version"

              # Validate version format
              if ($version -notmatch '^v?\d+\.\d+\.\d+') {
                throw "Invalid version format: '$version'. Expected format: v0.0.0 or 0.0.0"
              }
            } elseif ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}"
              Write-Host "✓ Using tag version: $version"

              # Validate tag version format
              if ($version -notmatch '^v?\d+\.\d+\.\d+') {
                throw "Invalid tag version format: '$version'. Expected format: v0.0.0"
              }
            } else {
              Write-Host "📋 Reading version from package.json..."

              # Check if package.json exists
              if (-not (Test-Path "package.json")) {
                throw "package.json not found in repository root"
              }

              # Read and parse package.json
              $packageJson = Get-Content package.json -Raw | ConvertFrom-Json

              # Validate version field exists
              if (-not $packageJson.version) {
                throw "No 'version' field found in package.json"
              }

              $packageVersion = $packageJson.version
              Write-Host "📦 Found package.json version: $packageVersion"

              # Validate version format
              if ($packageVersion -notmatch '^\d+\.\d+\.\d+') {
                throw "Invalid package.json version format: '$packageVersion'. Expected format: 0.0.0"
              }

              $version = "v$packageVersion"
              Write-Host "✓ Using package.json version: $version"
            }

            # Final validation - ensure no invalid characters for filename
            if ($version -match '[<>:"/\\|?*]') {
              throw "Version contains invalid filename characters: '$version'"
            }

            & node scripts/check-version-consistency.mjs --expected $version
            if ($LASTEXITCODE -ne 0) {
              throw "Selected package version '$version' does not match the repository manifests"
            }

            Write-Host "🎯 Final PACKAGE_VERSION: $version"
            echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
            echo "version=$version" >> $env:GITHUB_OUTPUT

          } catch {
            Write-Error "❌ Failed to determine package version: $($_.Exception.Message)"
            Write-Error "📋 Context: github.event.inputs.version='${{ github.event.inputs.version }}', github.ref_type='${{ github.ref_type }}', github.ref_name='${{ github.ref_name }}'"
            exit 1
          }

      - name: Install workspace dependencies (CI)
        run: npm ci --workspaces --include-workspace-root

      - name: Run isolated Windows installer safety fixtures
        run: npm run test:windows-installer-safety

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Build MCP Server (Bundled)
        run: npm run build:bundle --workspace=packages/mcp-server

      - name: Setup NSIS
        run: choco install nsis -y

      - name: Build NSIS Installer
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          cd installer
          node build-nsis.js --version $env:PACKAGE_VERSION

      - name: Exercise packaged Windows lifecycle
        env:
          FOUNDRY_MCP_ALLOW_PACKAGED_LIFECYCLE_TEST: '1'
          FOUNDRY_MCP_LIFECYCLE_INSTALLER: installer\build\FoundryVTT-MCP-Bridge-Setup-${{ env.PACKAGE_VERSION }}.exe
        run: npm run test:windows-packaged-lifecycle

      - name: Verify installer package
        run: |
          cd installer/build
          dir
          if (Test-Path "FoundryVTT-MCP-Bridge-Setup-$env:PACKAGE_VERSION.exe") {
            Write-Host "✓ NSIS installer found"
            $size = (Get-Item "FoundryVTT-MCP-Bridge-Setup-$env:PACKAGE_VERSION.exe").Length / 1MB
            Write-Host "📊 Installer size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Host "❌ NSIS installer not found"
            exit 1
          }

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v6
        with:
          name: foundry-vtt-mcp-bridge-installer-${{ env.PACKAGE_VERSION }}
          path: installer/build/FoundryVTT-MCP-Bridge-Setup-${{ env.PACKAGE_VERSION }}.exe
          retention-days: 30

  build-mac-pkg:
    needs: quality
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Set Package Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "✓ Using manual input version: $VERSION"

            # Validate version format
            if ! echo "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "❌ Invalid version format: '$VERSION'. Expected format: v0.0.0 or 0.0.0"
              exit 1
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            echo "✓ Using tag version: $VERSION"

            # Validate tag version format
            if ! echo "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "❌ Invalid tag version format: '$VERSION'. Expected format: v0.0.0"
              exit 1
            fi
          else
            echo "📋 Reading version from package.json..."

            # Check if package.json exists
            if [ ! -f "package.json" ]; then
              echo "❌ package.json not found in repository root"
              exit 1
            fi

            # Read and parse package.json (using node for JSON parsing)
            PACKAGE_VERSION=$(node -p "require('./package.json').version")

            # Validate version field exists
            if [ -z "$PACKAGE_VERSION" ]; then
              echo "❌ No 'version' field found in package.json"
              exit 1
            fi

            echo "📦 Found package.json version: $PACKAGE_VERSION"

            # Validate version format
            if ! echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "❌ Invalid package.json version format: '$PACKAGE_VERSION'. Expected format: 0.0.0"
              exit 1
            fi

            VERSION="v$PACKAGE_VERSION"
            echo "✓ Using package.json version: $VERSION"
          fi

          node scripts/check-version-consistency.mjs --expected "$VERSION"

          echo "🎯 Final PACKAGE_VERSION: $VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install workspace dependencies (CI)
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Build MCP Server (Bundled)
        run: npm run build:bundle --workspace=packages/mcp-server

      - name: Build Foundry Module
        run: npm run build --workspace=packages/foundry-module

      - name: Build Mac PKG Installer
        run: |
          cd installer
          VERSION_NO_V="${PACKAGE_VERSION#v}"
          VERSION="$VERSION_NO_V" node build-mac-pkg.js

      - name: Build Mac DMG Distribution
        run: |
          cd installer
          VERSION_NO_V="${PACKAGE_VERSION#v}"
          VERSION="$VERSION_NO_V" node build-dmg.js

      - name: Verify Mac DMG
        run: |
          cd installer/build
          ls -lh
          # Strip 'v' prefix from version for filename check
          VERSION="${{ env.PACKAGE_VERSION }}"
          VERSION_NO_V="${VERSION#v}"
          if [ -f "FoundryMCPServer-${VERSION_NO_V}.dmg" ]; then
            echo "✓ Mac DMG distribution found"
            SIZE=$(du -h "FoundryMCPServer-${VERSION_NO_V}.dmg" | cut -f1)
            echo "📊 DMG size: $SIZE"
            # Copy with v prefix for artifact upload consistency
            cp "FoundryMCPServer-${VERSION_NO_V}.dmg" "FoundryMCPServer-${VERSION}.dmg"
          else
            echo "❌ Mac DMG not found (expected: FoundryMCPServer-${VERSION_NO_V}.dmg)"
            exit 1
          fi

      - name: Upload Mac DMG as artifact
        uses: actions/upload-artifact@v6
        with:
          name: foundry-mcp-server-dmg-${{ env.PACKAGE_VERSION }}
          path: installer/build/FoundryMCPServer-${{ env.PACKAGE_VERSION }}.dmg
          retention-days: 30

  create-release:
    needs: [build-nsis, build-mac-pkg]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Set Package Version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix for filenames if present
          PACKAGE_VERSION="${VERSION#v}"
          node scripts/check-version-consistency.mjs --expected "$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=v$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "version=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v6
        with:
          name: foundry-vtt-mcp-bridge-installer-${{ env.PACKAGE_VERSION }}
          path: installer/build/

      - name: Download Mac DMG artifact
        uses: actions/download-artifact@v6
        with:
          name: foundry-mcp-server-dmg-${{ env.PACKAGE_VERSION }}
          path: installer/build/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Foundry MCP Server ${{ github.ref_name }}
          body: |
            ## Foundry MCP Server ${{ github.ref_name }}

            Complete multi-platform distribution for connecting MCP clients with Foundry VTT.

            **Compatible with Foundry VTT v13 and v14.**

            ### Installation Options

            **Windows Users:**
            - Download `FoundryVTT-MCP-Bridge-Setup-${{ github.ref_name }}.exe`
            - Do not download GitHub's automatically generated Source code ZIP
            - Run installer (no admin rights required)
            - Automatic Claude Desktop, Claude Code, and Codex configuration

            **Mac Users:**
            - Download `FoundryMCPServer-${{ github.ref_name }}.dmg`
            - Open DMG and double-click the PKG installer
            - Choose components: MCP Server (required) and Foundry Module
            - Automatic Claude Desktop configuration
            - To uninstall: Double-click `Uninstall.tool` from the DMG

            **Foundry VTT Users:**
            - Install directly from Foundry's module browser
            - Or use manifest: `https://github.com/webmaster94/foundry-vtt-mcp/releases/latest/download/module.json`

            ### Quick Start
            1. Download and run the installer for your platform
            2. Install MCP Bridge module in Foundry VTT
            3. Restart Claude Desktop
            4. Start managing the connected Foundry world from your MCP client

            ### Features
            - Generic Foundry document management with dry-run, audit, and undo
            - Multi-system support: D&D 5e, Pathfinder 2e, DSA5, Cosmere RPG, WFRP4e, and Mongoose Traveller 2e
            - D&D 5e NPC creation suite: stat blocks, attacks, saves, auras, and spellcasting
            - Actor creation with natural language processing
            - Quest management with HTML generation and updates
            - Campaign system with multi-part structure and progress tracking
            - Dice roll coordination between Claude and Foundry players
            - Actor ownership management with bulk operations
            - Bounded compendium search over live Foundry data
            - Persistent backend connections, events, and multi-server routing

            For full documentation, visit: https://github.com/webmaster94/foundry-vtt-mcp
          files: |
            installer/build/FoundryVTT-MCP-Bridge-Setup-${{ env.PACKAGE_VERSION }}.exe
            installer/build/FoundryMCPServer-${{ env.PACKAGE_VERSION }}.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Foundry VTT Package Registry
        env:
          FOUNDRY_PACKAGE_RELEASE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
        run: |
          if [ -z "$FOUNDRY_PACKAGE_RELEASE_TOKEN" ]; then
            echo "::notice::FOUNDRY_PACKAGE_RELEASE_TOKEN is not configured; skipping the optional Foundry package-registry update."
            exit 0
          fi

          echo "🔄 Updating Foundry VTT Package Registry..."

          # Extract package information
          PACKAGE_ID=$(node -p "require('./packages/foundry-module/module.json').id")
          VERSION="${{ env.PACKAGE_VERSION }}"
          VERSION="${VERSION#v}"  # Remove v prefix
          MANIFEST_URL="https://github.com/webmaster94/foundry-vtt-mcp/releases/download/${{ github.ref_name }}/module.json"
          RELEASE_NOTES_URL="https://github.com/webmaster94/foundry-vtt-mcp/releases/tag/${{ github.ref_name }}"

          MINIMUM=$(node -p "require('./packages/foundry-module/module.json').compatibility.minimum")
          VERIFIED=$(node -p "require('./packages/foundry-module/module.json').compatibility.verified")
          MAXIMUM=$(node -p "require('./packages/foundry-module/module.json').compatibility.maximum")

          echo "📦 Package ID: $PACKAGE_ID"
          echo "📝 Version: $VERSION"
          echo "📎 Manifest URL: $MANIFEST_URL"
          echo "📋 Release Notes: $RELEASE_NOTES_URL"

          # Prepare API request body
          REQUEST_BODY=$(cat <<EOF
          {
            "id": "$PACKAGE_ID",
            "release": {
              "version": "$VERSION",
              "manifest": "$MANIFEST_URL",
              "notes": "$RELEASE_NOTES_URL",
              "compatibility": {
                "minimum": "$MINIMUM",
                "verified": "$VERIFIED",
                "maximum": "$MAXIMUM"
              }
            }
          }
          EOF
          )

          echo "🔧 Request Body:"
          echo "$REQUEST_BODY"

          # Make API call to Foundry VTT Package Registry
          RESPONSE=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: $FOUNDRY_PACKAGE_RELEASE_TOKEN" \
            -d "$REQUEST_BODY" \
            https://foundryvtt.com/_api/packages/release_version/)

          if [ $? -eq 0 ]; then
            echo "✅ Successfully updated Foundry VTT Package Registry"
            echo "📄 Response: $RESPONSE"
          else
            echo "❌ Failed to update Foundry VTT Package Registry"
            echo "🔍 Error: $RESPONSE"
            exit 1
          fi
